name: openbsd-check (personal experiment, not for upstream)
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check-openbsd:
    name: cargo check --target x86_64-unknown-openbsd
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # x86_64-unknown-openbsd is a tier-3 rustc target: no prebuilt `std` is
      # shipped, so `rustup target add` doesn't work for it. Cross-building
      # std from source via `-Z build-std` (nightly + rust-src) is the way to
      # type-check against it without a real OpenBSD machine. This only ever
      # runs `cargo check`, not `build` -- actually linking would need a real
      # OpenBSD sysroot/cross-linker, which this runner doesn't have.
      - name: Install nightly toolchain with rust-src
        run: rustup toolchain install nightly --component rust-src

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: openbsd-check

      - name: cargo check --target x86_64-unknown-openbsd
        run: |
          cargo +nightly check \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-openbsd \
            --no-default-features \
            --features rustls,vfox/vendored-lua,self_update
