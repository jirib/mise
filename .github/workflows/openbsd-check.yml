name: openbsd-check (personal experiment, not for upstream)
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPENBSD_VERSION: "7.9"
  OPENBSD_SYSROOT: ${{ github.workspace }}/openbsd-sysroot

permissions:
  contents: read

jobs:
  build-openbsd:
    name: cargo build --target x86_64-unknown-openbsd (real cross-link)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # x86_64-unknown-openbsd is a tier-3 rustc target: no prebuilt `std` is
      # shipped, so `rustup target add` doesn't work for it. Cross-building
      # std from source via `-Z build-std` (nightly + rust-src) is required
      # regardless of check vs build.
      - name: Install nightly toolchain with rust-src
        run: rustup toolchain install nightly --component rust-src

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: openbsd-build

      # base+comp give us /usr/include and /usr/lib for an OpenBSD 7.9
      # amd64 install -- enough for clang/lld to cross-link against,
      # without needing a real OpenBSD machine. `--exclude ./dev` skips
      # device nodes tar can't recreate as a non-root, non-OpenBSD host.
      - name: Download and extract OpenBSD ${{ env.OPENBSD_VERSION }} base/comp sets
        run: |
          mkdir -p "$OPENBSD_SYSROOT"
          cd "$OPENBSD_SYSROOT"
          ver_nodot="${OPENBSD_VERSION/./}"
          curl -sSfL -O "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/amd64/base${ver_nodot}.tgz"
          curl -sSfL -O "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/amd64/comp${ver_nodot}.tgz"
          sudo tar xzpf "base${ver_nodot}.tgz" --exclude='./dev' -C "$OPENBSD_SYSROOT"
          sudo tar xzpf "comp${ver_nodot}.tgz" --exclude='./dev' -C "$OPENBSD_SYSROOT"
          sudo chown -R "$(id -u):$(id -g)" "$OPENBSD_SYSROOT"
          ls "$OPENBSD_SYSROOT/usr/include" | head
          ls "$OPENBSD_SYSROOT/usr/lib" | head

      # OpenBSD has no bare libfoo.so -- ld(1)/ld.so(1) resolve -lfoo against
      # libfoo.so.major.minor by scanning for the right version (see the
      # Porter's Handbook: "Understanding Shared Library Number Rules").
      # That convention is implemented by OpenBSD's own linker driver, not
      # by lld, so a generic cross-link silently falls back to the static
      # .a and collides with crtbeginS.o. Pre-resolve it ourselves: symlink
      # each libfoo.so to its highest available major.minor.
      - name: Create unversioned .so symlinks for the cross-linker
        run: |
          cd "$OPENBSD_SYSROOT/usr/lib"
          for f in lib*.so.*.*; do
            [ -f "$f" ] || continue
            base="${f%%.so.*}"
            echo "$base $f"
          done | sort -k1,1 -k2,2V | awk '{ link[$1]=$2 } END { for (b in link) print b, link[b] }' \
          | while read -r base target; do
              ln -sf "$target" "${base}.so"
              echo "${base}.so -> $target"
            done

      - name: Install clang/lld for cross-linking
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Configure cargo for the openbsd cross target
        run: |
          mkdir -p .cargo
          ver="${OPENBSD_VERSION}"
          cat > .cargo/config.toml <<EOF
          [target.x86_64-unknown-openbsd]
          linker = "clang"
          rustflags = [
            "-C", "link-arg=--target=x86_64-unknown-openbsd${ver}",
            "-C", "link-arg=--sysroot=${OPENBSD_SYSROOT}",
            "-C", "link-arg=-fuse-ld=lld",
            "-C", "link-arg=-L${OPENBSD_SYSROOT}/usr/lib",
          ]
          EOF
          cat .cargo/config.toml

      # rustc's own linker flags (above) only cover the final link step.
      # Build-dependency C code (e.g. aws-lc-sys, zstd-sys) is compiled by
      # the `cc` crate directly, which doesn't read .cargo/config.toml at
      # all -- it needs these CC_*/CFLAGS_*/AR_* env vars instead, or it
      # silently falls back to the host's native cc with no sysroot, which
      # mismatches whatever target_os-specific flags the *-sys crate adds.
      - name: Configure cc-rs env vars for openbsd C cross-compilation
        run: |
          # cc-rs (and bindgen) key these off the target triple with
          # hyphens replaced by underscores, since shells can't export
          # hyphenated names.
          t="x86_64_unknown_openbsd"
          flags="--target=x86_64-unknown-openbsd${OPENBSD_VERSION} --sysroot=${OPENBSD_SYSROOT}"
          {
            echo "CC_${t}=clang"
            echo "CXX_${t}=clang++"
            echo "AR_${t}=llvm-ar"
            echo "CFLAGS_${t}=${flags}"
            echo "CXXFLAGS_${t}=${flags}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_${t}=${flags}"
          } >> "$GITHUB_ENV"

      - name: cargo build --target x86_64-unknown-openbsd
        run: |
          cargo +nightly build \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-openbsd \
            --no-default-features \
            --features rustls,vfox/vendored-lua,self_update
